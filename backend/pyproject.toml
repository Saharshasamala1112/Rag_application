[project]
name = "local-rag-backend"
version = "0.1.0"
description = "Production-ready Local RAG Backend"
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"