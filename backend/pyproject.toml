[project]
name = "local-rag-backend"
version = "0.1.0"
description = "Production-ready Local RAG Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn[standard]==0.51.0",
    "python-multipart==0.0.32",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pymupdf==1.28.2",
    "pymupdf4llm==1.28.2",
    "python-docx==1.2.0",
    "langchain-text-splitters==1.1.2",
    "faiss-cpu==1.15.0",
    "numpy==2.5.1",
    "ollama==0.6.2",
    "tiktoken==0.14.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.22",
    "vulture==2.16",
]
models = [
    "sentence-transformers==5.6.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# vulture whitelist: bare name references are data for vulture, not runnable code.
"scripts/vulture_whitelist.py" = ["F821"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
