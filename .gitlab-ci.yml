stages:
  - backend
  - quality

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
    - when: never

variables:
  FF_NETWORK_PER_BUILD: "true"

default:
  interruptible: true

.frontend-base:
  image: node:22-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules
  before_script:
    # node:22-alpine ships without git; the job diffs generated API types
    - apk add --no-cache git
    - cd frontend
    - npm ci --no-audit --no-fund

backend-quality:
  image: python:3.12-slim
  stage: backend
  before_script:
    - python -m pip install --no-cache-dir uv==0.11.29
    - cd backend
    - uv sync --frozen --extra dev
  script:
    - uv run python -m scripts.update_openapi_schema --check
    - uv run ruff check app tests scripts
    # Dead-code scan: decorators cover FastAPI/pydantic wiring, whitelist covers
    # reflection-only fields (see backend/scripts/vulture_whitelist.py).
    - uv run vulture app scripts/vulture_whitelist.py --min-confidence 60 --ignore-decorators "@router.get,@router.post,@router.patch,@router.delete,@router.put,@app.get,@app.post,@app.exception_handler,@app.on_event,@field_validator,@model_validator,@app.middleware"
    - uv run pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=junit.xml --cov-fail-under=70
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      junit: backend/junit.xml
    paths:
      - backend/coverage.xml
      - backend/junit.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH

frontend-quality:
  extends: .frontend-base
  stage: quality
  script:
    - npm run generate:api-types
    - git diff --exit-code -- src/types/api.generated.ts
    - npm run typecheck
    - npm run lint
    - npm run knip
    - npm test -- --reporter=default --reporter=junit --outputFile.junit=junit.xml
    - npm run build
  artifacts:
    when: always
    reports:
      junit: frontend/junit.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
