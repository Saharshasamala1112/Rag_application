stages:
  - backend
  - quality

variables:
  FF_NETWORK_PER_BUILD: "true"

default:
  interruptible: true

.frontend-base:
  image: node:22-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules
  before_script:
    - cd frontend
    - npm ci --no-audit --no-fund

frontend-quality:
  extends: .frontend-base
  stage: quality
  script:
    - npm run generate:api-types
    - git diff --exit-code -- src/types/api.generated.ts
    - npm run typecheck
    - npm run lint
    - npm test
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

backend-quality:
  image: python:3.12-slim
  stage: backend
  before_script:
    - python -m pip install --no-cache-dir uv==0.11.29
    - cd backend
    - uv sync --frozen --extra dev
  script:
    - uv run python -m scripts.update_openapi_schema --check
    - uv run ruff check app tests
    - uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=70
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
